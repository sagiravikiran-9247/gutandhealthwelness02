<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="sunGlow" cx="72%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#FFF7DC"/>
      <stop offset="55%" stop-color="#F6E9D2"/>
      <stop offset="100%" stop-color="#E8D4B8"/>
    </radialGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7B98E"/>
      <stop offset="100%" stop-color="#C19E6E"/>
    </linearGradient>
    <linearGradient id="manjistaCloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DF807D"/>
      <stop offset="50%" stop-color="#D16C69"/>
      <stop offset="100%" stop-color="#BC5956"/>
    </linearGradient>
    <linearGradient id="creamCloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF7EC"/>
      <stop offset="100%" stop-color="#EAE0CA"/>
    </linearGradient>
    <linearGradient id="sageCloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8CB2A4"/>
      <stop offset="100%" stop-color="#6B9486"/>
    </linearGradient>
    <pattern id="cottonWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6h12M6 0v12" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
      <path d="M0 3h12M3 0v12" stroke="#000000" stroke-opacity="0.04" stroke-width="0.6"/>
    </pattern>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5B422D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Studio backdrop -->
  <rect width="800" height="800" fill="url(#sunGlow)"/>

  <!-- Warm bokeh sun circles -->
  <circle cx="620" cy="140" r="140" fill="#FFFDF4" fill-opacity="0.45"/>
  <circle cx="130" cy="180" r="95" fill="#DCE8DF" fill-opacity="0.4"/>

  <!-- Botanical leaves top left -->
  <g opacity="0.85">
    <path d="M35 190 C90 120, 180 120, 220 185 C160 205, 95 215, 35 190 Z" fill="#5D8768"/>
    <path d="M35 190 C105 165, 165 168, 210 182" stroke="#9FC2A7" stroke-width="2" fill="none"/>
    <path d="M10 110 C75 65, 145 80, 175 135 C120 148, 65 145, 10 110 Z" fill="#739C7C"/>
  </g>

  <!-- Wooden / Woven tabletop -->
  <rect x="0" y="530" width="800" height="270" fill="url(#matGrad)"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#A68255" stroke-width="3"/>

  <!-- Bottom folded Cream Cotton Kerchief -->
  <g filter="url(#softShadow)" transform="translate(155, 395) rotate(-4)">
    <rect x="0" y="0" width="460" height="225" rx="22" fill="url(#creamCloth)" stroke="#D9CCB2" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="225" rx="22" fill="url(#cottonWeave)"/>
    <rect x="16" y="16" width="428" height="193" rx="14" fill="none" stroke="#C7B899" stroke-width="1.8" stroke-dasharray="6 5"/>
  </g>

  <!-- Middle folded Sage Cotton Kerchief -->
  <g filter="url(#softShadow)" transform="translate(175, 315) rotate(2.5)">
    <rect x="0" y="0" width="445" height="220" rx="22" fill="url(#sageCloth)" stroke="#5C8577" stroke-width="2"/>
    <rect x="0" y="0" width="445" height="220" rx="22" fill="url(#cottonWeave)"/>
    <rect x="16" y="16" width="413" height="188" rx="14" fill="none" stroke="#DCEBE5" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="6 5"/>
  </g>

  <!-- Top folded Manjista Root-Dyed Terracotta Pink Cotton Kerchief -->
  <g filter="url(#softShadow)" transform="translate(170, 215) rotate(-1.5)">
    <rect x="0" y="0" width="445" height="240" rx="24" fill="url(#manjistaCloth)" stroke="#A74A47" stroke-width="2"/>
    <rect x="0" y="0" width="445" height="240" rx="24" fill="url(#cottonWeave)"/>
    <!-- Folded edge crease -->
    <path d="M0 175 Q222 192 445 175" fill="none" stroke="#9B3F3C" stroke-opacity="0.35" stroke-width="3"/>
    <!-- Hemstitch -->
    <rect x="16" y="16" width="413" height="208" rx="14" fill="none" stroke="#FAD8D6" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- Pure Cotton Woven Tag -->
    <rect x="330" y="34" width="74" height="32" rx="6" fill="#FAF5EB" stroke="#DFD2BC" stroke-width="1.5"/>
    <path d="M350 50 C358 41, 376 41, 384 50 C376 59, 358 59, 350 50 Z" fill="#638E72"/>
  </g>

  <!-- Foreground natural leaf accents -->
  <g transform="translate(565, 520)">
    <path d="M0 60 C35 5, 115 0, 155 48 C105 82, 42 84, 0 60 Z" fill="#4E7B5A"/>
    <path d="M40 72 C75 30, 140 36, 172 78 C122 102, 72 98, 40 72 Z" fill="#6D9B78"/>
  </g>
</svg>
